<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <!--
    Theme bootstrap: sets `data-theme` on <html> from localStorage before
    any stylesheet below is parsed, so the page never flashes Reaktor Dark
    before repainting into a stored preference. Plain, synchronous, inline
    -- an ES module (`type="module"`, like rack/main.ts below) is always
    deferred, which runs it after CSSOM/first-paint timing and would bring
    the flash right back. rack/theme-switcher.ts owns every *other* piece
    of theme state (the visible switcher, persisting a change) -- this
    script's only job is "the first paint already has the right attribute."
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('sinsthesis-theme');
        document.documentElement.dataset.theme = stored || 'reaktor-dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'reaktor-dark';
      }
    })();
  </script>
  <!--
    All twelve theme files are loaded, not just the active one -- each scopes
    its custom properties under `:root[data-theme="<id>"]` (see any
    rack/theme-*.css file's own header comment), so exactly one theme's
    rules ever win and switching is a single attribute write with no
    network request, no flash, no re-render of anything but computed style.
  -->
  <link rel="stylesheet" href="/rack/theme-reaktor-dark.css" />
  <link rel="stylesheet" href="/rack/theme-moog-wood.css" />
  <link rel="stylesheet" href="/rack/theme-phosphor-lab.css" />
  <link rel="stylesheet" href="/rack/theme-ableton-live.css" />
  <link rel="stylesheet" href="/rack/theme-circuit-pcb.css" />
  <link rel="stylesheet" href="/rack/theme-geist-groovebox.css" />
  <link rel="stylesheet" href="/rack/theme-casiotone.css" />
  <link rel="stylesheet" href="/rack/theme-korg-ms20.css" />
  <link rel="stylesheet" href="/rack/theme-brimstone.css" />
  <link rel="stylesheet" href="/rack/theme-space-station.css" />
  <link rel="stylesheet" href="/rack/theme-vaporwave.css" />
  <link rel="stylesheet" href="/rack/theme-psychedelic.css" />
  <link rel="stylesheet" href="/rack/style.css" />
  <title>SinsThesis — rack</title>
</head>
<body>
  <header class="masthead">
    <div class="masthead-row">
      <div>
        <h1>SINSTHESIS <span class="dim">// rack</span></h1>
        <p class="dim">descriptor-driven panels, draggable patch cables — twelve themes, same geometry.</p>
      </div>
      <div id="theme-switcher" class="theme-switcher" data-testid="theme-switcher"></div>
    </div>
    <p class="dim harness-link">
      Need the scope and spectrum for engine work? <a href="./harness.html">Open the dev harness</a>.
    </p>
  </header>

  <section id="power-section" class="power-section">
    <button id="power-btn" data-testid="power" class="power-btn">POWER ON</button>
    <p class="dim">audio requires a user gesture — nothing runs until this is pressed.</p>
  </section>

  <main id="app" hidden data-testid="app">
    <div id="toolbar" class="toolbar" data-testid="toolbar">
      <div class="mode-toggle" data-testid="mode-toggle">
        <button id="mode-freeplay" data-testid="mode-freeplay" class="mode-toggle-btn" type="button">Free Play</button>
        <button id="mode-academy" data-testid="mode-academy" class="mode-toggle-btn" type="button">Academy</button>
      </div>
      <button id="palette-toggle" data-testid="palette-toggle" class="toolbar-btn">+ Add Module</button>
      <button id="preset-bank-toggle" data-testid="preset-bank-toggle" class="toolbar-btn">Presets</button>
      <input id="patch-name" data-testid="patch-name" class="patch-name-input" value="Untitled" aria-label="Patch name" />
      <button id="save-patch" data-testid="save-patch" class="toolbar-btn">Save .sinp</button>
      <button id="load-patch" data-testid="load-patch" class="toolbar-btn">Load .sinp</button>
      <input id="load-file" data-testid="load-file-input" type="file" accept=".sinp,application/json" hidden />
    </div>
    <div id="studio-panel" class="studio-panel" data-testid="studio-panel"></div>
    <div id="pitch-display" class="pitch-display" data-testid="pitch-display" hidden></div>
    <div id="palette-drawer" class="palette-drawer" data-testid="palette-drawer" hidden></div>
    <div id="preset-bank-drawer" class="preset-bank-drawer" data-testid="preset-bank-drawer" hidden></div>
    <div id="academy-panel" class="academy-panel" data-testid="academy-panel" hidden></div>
    <div id="status-banner" class="status-banner" data-testid="status-banner" hidden></div>
    <div id="rack-surface" class="rack-surface" data-testid="rack-surface">
      <div id="rack-modules" class="rack-modules" data-testid="rack-modules"></div>
    </div>
  </main>

  <script type="module" src="/rack/main.ts"></script>
</body>
</html>
